services:
  - type: web
    name: game-booking-platform
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm run seed && npm start
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard to a persistent Postgres connection string (e.g. Neon) — a local file: URL has no disk to survive a restart
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://game-booking-platform.onrender.com
